naftiko: 1.0.0-alpha2
info:
  label: Rainbow Messaging API — Bubbles
  description: 'Rainbow Messaging API — Bubbles. 3 operations. Lead operation: List Bubbles. Self-contained Naftiko capability
    covering one Rainbow business surface.'
  tags:
  - Rainbow
  - Bubbles
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RAINBOW_API_KEY: RAINBOW_API_KEY
capability:
  consumes:
  - type: http
    namespace: messaging-bubbles
    baseUri: https://openrainbow.com/api/rainbow
    description: Rainbow Messaging API — Bubbles business capability. Self-contained, no shared references.
    resources:
    - name: enduser-v1.0-bubbles
      path: /enduser/v1.0/bubbles
      operations:
      - name: listbubbles
        method: GET
        description: List Bubbles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
          description: Maximum number of bubbles to return
        - name: offset
          in: query
          type: integer
          description: Pagination offset
      - name: createbubble
        method: POST
        description: Create Bubble
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: enduser-v1.0-bubbles-bubbleId
      path: /enduser/v1.0/bubbles/{bubbleId}
      operations:
      - name: getbubble
        method: GET
        description: Get Bubble
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: bubbleId
          in: path
          type: string
          description: Unique identifier of the bubble
          required: true
    authentication:
      type: bearer
      token: '{{env.RAINBOW_API_KEY}}'
  exposes:
  - type: rest
    namespace: messaging-bubbles-rest
    port: 8080
    description: REST adapter for Rainbow Messaging API — Bubbles. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/enduser/v1-0/bubbles
      name: enduser-v1-0-bubbles
      description: REST surface for enduser-v1.0-bubbles.
      operations:
      - method: GET
        name: listbubbles
        description: List Bubbles
        call: messaging-bubbles.listbubbles
        with:
          limit: rest.limit
          offset: rest.offset
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createbubble
        description: Create Bubble
        call: messaging-bubbles.createbubble
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/enduser/v1-0/bubbles/{bubbleid}
      name: enduser-v1-0-bubbles-bubbleid
      description: REST surface for enduser-v1.0-bubbles-bubbleId.
      operations:
      - method: GET
        name: getbubble
        description: Get Bubble
        call: messaging-bubbles.getbubble
        with:
          bubbleId: rest.bubbleId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: messaging-bubbles-mcp
    port: 9090
    transport: http
    description: MCP adapter for Rainbow Messaging API — Bubbles. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-bubbles
      description: List Bubbles
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: messaging-bubbles.listbubbles
      with:
        limit: tools.limit
        offset: tools.offset
      outputParameters:
      - type: object
        mapping: $.
    - name: create-bubble
      description: Create Bubble
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: messaging-bubbles.createbubble
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-bubble
      description: Get Bubble
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: messaging-bubbles.getbubble
      with:
        bubbleId: tools.bubbleId
      outputParameters:
      - type: object
        mapping: $.
