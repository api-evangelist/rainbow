naftiko: "1.0.0-alpha1"

info:
  label: Rainbow Contacts API
  description: >-
    Rainbow CPaaS contacts and directory management including search, profile
    retrieval, and presence management.
  tags:
    - Contacts
    - Directory
    - Presence
    - Users
    - CPaaS
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      RAINBOW_BEARER_TOKEN: RAINBOW_BEARER_TOKEN

capability:
  consumes:
    - type: http
      namespace: contacts
      baseUri: https://openrainbow.com/api/rainbow
      description: Rainbow Contacts REST API
      authentication:
        type: bearer
        token: "{{RAINBOW_BEARER_TOKEN}}"
      resources:
        - name: contacts
          path: /enduser/v1.0/contacts
          description: Search and manage contacts
          operations:
            - name: search-contacts
              method: GET
              description: Search contacts by name, email, or phone
              inputParameters:
                - name: search
                  in: query
                  type: string
                  required: false
                  description: Search keyword
                - name: limit
                  in: query
                  type: integer
                  required: false
                - name: offset
                  in: query
                  type: integer
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: contact-detail
          path: /enduser/v1.0/contacts/{contactId}
          description: Get a specific contact
          operations:
            - name: get-contact
              method: GET
              description: Get contact profile and presence
              inputParameters:
                - name: contactId
                  in: path
                  type: string
                  required: true
                  description: Contact ID
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: my-profile
          path: /enduser/v1.0/users/me
          description: Authenticated user's profile
          operations:
            - name: get-my-profile
              method: GET
              description: Get current user's profile
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: my-presence
          path: /enduser/v1.0/users/me/presence
          description: Manage user presence status
          operations:
            - name: update-presence
              method: PUT
              description: Update presence status
              body:
                type: json
                data:
                  presence: "{{tools.presence}}"
                  status: "{{tools.status}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8101
      namespace: rainbow-contacts-rest
      resources:
        - path: /v1/contacts
          name: contacts
          operations:
            - method: GET
              name: search-contacts
              description: Search contacts
              call: "contacts.search-contacts"
              with:
                search: "rest.search"
                limit: "rest.limit"
                offset: "rest.offset"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/contacts/{id}
          name: contact-detail
          operations:
            - method: GET
              name: get-contact
              description: Get contact profile
              call: "contacts.get-contact"
              with:
                contactId: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/users/me
          name: my-profile
          operations:
            - method: GET
              name: get-my-profile
              description: Get authenticated user profile
              call: "contacts.get-my-profile"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/users/me/presence
          name: my-presence
          operations:
            - method: PUT
              name: update-presence
              description: Update presence status
              call: "contacts.update-presence"
              with:
                presence: "rest.presence"
                status: "rest.status"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: rainbow-contacts-mcp
      transport: http
      tools:
        - name: search-contacts
          description: Search Rainbow directory for contacts by name, email, or phone
          hints:
            readOnly: true
            openWorld: true
          call: "contacts.search-contacts"
          with:
            search: "tools.search"
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-contact
          description: Get profile and presence status for a specific contact
          hints:
            readOnly: true
            openWorld: false
          call: "contacts.get-contact"
          with:
            contactId: "tools.contactId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-my-profile
          description: Get the authenticated user's own profile information
          hints:
            readOnly: true
            openWorld: false
          call: "contacts.get-my-profile"
          outputParameters:
            - type: object
              mapping: "$."
        - name: update-presence
          description: Update user presence status (online, away, busy, dnd)
          hints:
            readOnly: false
            idempotent: true
          call: "contacts.update-presence"
          with:
            presence: "tools.presence"
            status: "tools.status"
          outputParameters:
            - type: object
              mapping: "$."
