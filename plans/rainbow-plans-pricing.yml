notes: Rainbow CPaaS by Alcatel-Lucent Enterprise (ALE) does not publish a public per-API pricing tier
  table on its developer or product pages; both the al-enterprise.com Rainbow CPaaS landing path and
  the openrainbow.com pricing path returned 404 during reconciliation. Commercial terms are arranged
  through ALE's CPaaS sales team, with a free developer tier on the openrainbow.com developer hub for
  prototyping. Reconciled flagged false until a public pricing surface is published.
description: Rainbow exposes 200+ APIs and SDKs (Node.js, C#, iOS, Android) for chat, voice, video,
  file sharing, and telephony PBX. Developer access is available on the openrainbow.com developer hub;
  production pricing is contracted through Alcatel-Lucent Enterprise sales rather than a public tier
  table.
