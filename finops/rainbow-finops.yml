specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Rainbow
providerId: rainbow
publisherName: Alcatel-Lucent Enterprise
serviceCategory: Communications
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Communications
  - CPaaS
  - FinOps
  - FOCUS
notes: Rainbow does not publish a per-API meter or invoice surface; FinOps mapping is anchored to the
  ALE production contract.
description: FOCUS-aligned FinOps for Rainbow CPaaS is contract-based; chat, voice, video, and telephony
  consumption is billed under the ALE customer agreement rather than a public per-API tariff.
sources:
  - https://www.al-enterprise.com/en/products/communications/rainbow
  - https://developers.openrainbow.com/
billingModel:
  pricingCategory: Enterprise CPaaS Contract
  billingFrequency: Monthly
  billingCurrency: USD/EUR
  chargeCategories:
    - Purchase
    - Usage
focusColumns:
  ServiceName: Rainbow
  ServiceCategory: Communications
  ProviderName: Alcatel-Lucent Enterprise
  PublisherName: Alcatel-Lucent Enterprise
  InvoiceIssuerName: Alcatel-Lucent Enterprise
  BillingCurrency: USD/EUR
meters:
  - name: licensed_users
    description: Active Rainbow user accounts on the customer's CPaaS deployment.
    unit: seat
    aggregation: max
    dimensions:
      - tenant
      - region
  - name: telephony_minutes
    description: Voice and PBX minutes routed through the Rainbow telephony surface.
    unit: minute
    aggregation: sum
    dimensions:
      - tenant
      - destination_country
  - name: api_engagement
    description: API and SDK usage covered under the ALE production contract; not exposed as a public
      per-call meter.
    unit: varies
    aggregation: sum
    dimensions:
      - tenant
principles:
  - name: Visibility
    description: Pull licensed-user and telephony-minute reports from the ALE Rainbow administration
      console; production deployments expose tenant-level usage to administrators.
  - name: Allocation
    description: Allocate Rainbow seat and telephony spend to the consuming business unit or location;
      tenant scoping makes per-department attribution straightforward.
  - name: Optimization
    description: Right-size licensed-user counts at renewal and tune telephony routing to minimize cross-region
      egress; consolidate developer hub experimentation under a shared sandbox tenant.
  - name: Accountability
    description: Communications IT owns the Rainbow contract; finance reviews seat and minute consumption
      against the ALE agreement.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
