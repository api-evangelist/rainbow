aid: rainbow
name: Rainbow
description: >-
  Rainbow is a CPaaS platform from Alcatel-Lucent Enterprise (ALE) that lets developers enrich applications with chat,
  group chat, voice, video, file sharing, and telephony PBX features through more than 200 APIs, REST interfaces, and
  multi-language SDKs including Node.js, C#, iOS, and Android.
